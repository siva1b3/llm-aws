name: terraform_lab

services:
  terraform:
    image: hashicorp/terraform:1.15.9
    container_name: terraform_container

    working_dir: /workspace

    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "tail -f /dev/null" ]

    volumes:
      - ./:/workspace
      - ./.aws:/root/.aws:ro

    environment:
      AWS_PROFILE: terraform
