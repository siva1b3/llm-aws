---
- name: "[DEV-TOOLS | DEV001] Update APT package index"
  ansible.builtin.apt:
    update_cache: true

- name: "[DEV-TOOLS | DEV002] Install development utilities"
  ansible.builtin.apt:
    state: present
    name:
      - git
      - git-lfs
      - curl
      - wget
      - vim
      - nano
      - unzip
      - zip
      - tar
      - jq
      - tree
      - htop
      - tmux
      - rsync
      - bash-completion
      - build-essential
      - make
      - cmake
      - pkg-config
      - ca-certificates
      - gnupg
      - lsb-release
      - software-properties-common
      - openssh-client
      - python3
      - python3-pip
      - python3-venv
      - net-tools
      - iputils-ping
      - dnsutils
      - traceroute
      - openssl

- name: "[DEV-TOOLS | DEV003] Check Git LFS configuration for the login user"
  become: false
  ansible.builtin.command:
    argv: [git, config, --global, --get, "{{ item.key }}"]
  loop:
    - {key: filter.lfs.clean, value: 'git-lfs clean -- %f'}
    - {key: filter.lfs.smudge, value: 'git-lfs smudge -- %f'}
    - {key: filter.lfs.process, value: 'git-lfs filter-process'}
    - {key: filter.lfs.required, value: 'true'}
  loop_control:
    label: "{{ item.key }}"
  register: dev_lfs_config
  changed_when: false
  failed_when: dev_lfs_config.rc not in [0, 1]
  when: not ansible_check_mode

- name: "[DEV-TOOLS | DEV004] Initialize Git LFS for the login user"
  become: false
  ansible.builtin.command: git lfs install --skip-repo
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      dev_lfs_config.results[0].stdout != 'git-lfs clean -- %f' or
      dev_lfs_config.results[1].stdout != 'git-lfs smudge -- %f' or
      dev_lfs_config.results[2].stdout != 'git-lfs filter-process' or
      dev_lfs_config.results[3].stdout != 'true'
